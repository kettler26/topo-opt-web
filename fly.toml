app = "topo-opt-web"
primary_region = "fra"

[build]
  dockerfile = "backend/Dockerfile"

[env]
  PYTHONUNBUFFERED = "1"
  UPLOAD_DIR = "/app/uploads"
  RESULT_DIR = "/app/results"

[[mounts]]
  source = "topo_opt_data"
  destination = "/app"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 2048
